<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM — 项目管理</title>
  <link rel="stylesheet" href="/ui/pm.css" />
</head>
<body>
  <header>
    <h1>PM · 视频制作项目管理</h1>
    <nav class="nav">
      <a href="/" class="active">项目列表</a>
      <a href="/chat">对话入口</a>
    </nav>
  </header>
  <main>
    <div class="notice">
      本地 / 零付费 / 无付费 AI。付费能力显示为「未接入/需授权」，本入口不默认调用。
      离线替身/mock 不代表真实 AI 服务已接入或生成质量已验收。
    </div>

    <div class="card">
      <h2>新建项目</h2>
      <div class="row">
        <div><label>标题</label><input id="title" placeholder="例如：黑洞 60 秒科普讲解" /></div>
        <div><label>管线</label><select id="pipeline"></select></div>
        <div><label>预算 (USD)</label><input id="budget" type="number" step="0.1" value="0" /></div>
      </div>
      <div class="row">
        <div><label>成本模式</label><select id="mode"><option value="warn">warn</option><option value="observe">observe</option><option value="cap">cap</option></select></div>
        <div style="flex:0;align-self:flex-end"><button id="create">创建</button></div>
      </div>
      <p class="muted" id="create-msg"></p>
    </div>

    <div class="card">
      <h2>项目列表 <span class="muted" id="count"></span></h2>
      <table>
        <thead><tr><th>项目</th><th>管线</th><th>状态</th><th>预算</th><th>审批</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="/ui/pm.js"></script>
  <script>
    const statusColors = { draft: "", planning: "", approved: "ok", running: "ok", paused: "paid", completed: "ok", cancelled: "", failed: "paid" };
    async function loadPipelines() {
      try {
        const caps = await PM.api("/api/capabilities");
        // pipeline list is derived from the manifest catalog; fetch via a small
        // endpoint if present, else list from the select. We reuse /api/chat
        // is not ideal, so keep a static fallback from the 13 pipelines.
      } catch {}
      const sel = document.getElementById("pipeline");
      const names = ["animated-explainer","animation","avatar-spokesperson","character-animation","cinematic","clip-factory","documentary-montage","hybrid","localization-dub","podcast-repurpose","screen-demo","talking-head"];
      sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
    }
    async function loadList() {
      const projects = await PM.api("/api/projects");
      document.getElementById("count").textContent = `(${projects.length})`;
      const rows = document.getElementById("rows");
      if (!projects.length) { rows.innerHTML = `<tr><td colspan="6" class="muted">暂无项目。用上方表单或「对话入口」创建。</td></tr>`; return; }
      rows.innerHTML = projects.map(p => `
        <tr>
          <td><a href="/p/${encodeURIComponent(p.project_id)}">${PM.esc(p.title)}</a></td>
          <td>${PM.esc(p.pipeline_type)}</td>
          <td>${PM.pill(statusColors[p.status] || "", p.status)}</td>
          <td>${p.cost_budget_usd} <span class="muted">/ ${p.cost_mode}</span></td>
          <td>${p.approved ? PM.pill("ok","approved") : (p.requires_approval ? PM.pill("paid","pending") : PM.pill("","—"))}</td>
          <td><a href="/p/${encodeURIComponent(p.project_id)}">详情</a></td>
        </tr>`).join("");
    }
    document.getElementById("create").addEventListener("click", async () => {
      const msg = document.getElementById("create-msg");
      const payload = {
        title: document.getElementById("title").value.trim(),
        pipeline_type: document.getElementById("pipeline").value,
        cost_budget_usd: parseFloat(document.getElementById("budget").value) || 0,
        cost_mode: document.getElementById("mode").value,
      };
      if (!payload.title) { msg.textContent = "请填写标题"; return; }
      try {
        const p = await PM.post("/api/project", payload);
        msg.textContent = `已创建 ${p.project_id}`;
        document.getElementById("title").value = "";
        loadList();
      } catch (e) { msg.textContent = "创建失败: " + e.message; }
    });
    loadPipelines();
    loadList().catch((e) => { document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="paid">${PM.esc(e.message)}</td></tr>`; });
  </script>
</body>
</html>
